<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <meta name="description" content="Descubra quanto o celular disputa sua atenção.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="page-hero-inner" data-reveal>
        <p class="eyebrow">Quiz</p>
        <h1>Quanto o celular<br>disputa sua atenção?</h1>
        <p>Cinco perguntas rápidas. Sem certo ou errado: seja sincero.</p>
      </div>
    </section>
    <section class="container quiz-page" data-reveal>
      <div class="quiz-card quiz-big" id="quizBox"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="desafios-data.js"></script>
  <script src="site.js"></script>
  <script>
    const perguntas = [
      { q: "Durante uma aula, com que frequência você olha o celular?", o: ["Quase nunca", "Algumas vezes", "Muitas vezes", "O tempo todo"] },
      { q: "Quando chega uma notificação na aula, o que você faz?", o: ["Ignoro", "Olho rápido e guardo", "Abro e respondo", "Já estava com o celular na mão"] },
      { q: "Onde seu celular fica durante a aula?", o: ["Guardado na mochila", "No bolso", "Em cima da mesa", "Na mão ou no colo"] },
      { q: "Quando você não entende algo, qual é sua primeira reação?", o: ["Pergunto ao professor", "Anoto para depois", "Pergunto a um colega", "Pesquiso no celular na hora"] },
      { q: "No intervalo, o que você mais faz?", o: ["Converso com as pessoas", "Divido entre conversa e celular", "Fico mais no celular", "Fico só no celular"] }
    ];
    const resultados = [
      { max: 3, t: "Atenção em dia", m: "Seu hábito parece bem equilibrado. Continue protegendo seu momento de aprendizagem.", s: 12 },
      { max: 7, t: "Pequenas distrações", m: "Há pequenas distrações. Uma aula no modo silencioso já pode fazer diferença.", s: 1 },
      { max: 11, t: "Atenção disputada", m: "Seu celular está disputando bastante sua atenção. Experimente deixá-lo guardado durante a explicação.", s: 2 },
      { max: 15, t: "Distração alta", m: "Seu nível de distração é alto. Topa o desafio de passar uma aula sem olhar o celular?", s: 3 }
    ];
    const box = document.getElementById("quizBox");
    let i = 0, total = 0;

    function pergunta() {
      const p = perguntas[i];
      box.innerHTML = `
        <div class="quiz-top"><span>Pergunta ${i + 1} de ${perguntas.length}</span>
          <div class="challenge-progress-line"><div class="challenge-progress-fill" style="width:${(i / perguntas.length) * 100}%"></div></div></div>
        <p class="quiz-q">${p.q}</p>
        <div class="quiz-options">${p.o.map((t, k) => `<button class="quiz-option" type="button" data-score="${k}">${t}</button>`).join("")}</div>`;
      box.classList.remove("swap"); void box.offsetWidth; box.classList.add("swap");
      box.querySelectorAll(".quiz-option").forEach(b => b.addEventListener("click", () => {
        b.classList.add("selected");
        total += Number(b.dataset.score);
        setTimeout(() => { i++; i < perguntas.length ? pergunta() : fim(); }, 260);
      }));
    }
    function fim() {
      const r = resultados.find(x => total <= x.max);
      const alvo = r.s === 12 ? calcularSemanaAtual() : r.s;
      box.innerHTML = `
        <p class="eyebrow">Seu resultado · ${total} de ${perguntas.length * 3} pontos</p>
        <h2 class="quiz-title">${r.t}</h2>
        <div class="challenge-progress-line"><div class="challenge-progress-fill" style="width:${Math.max(6, (total / (perguntas.length * 3)) * 100)}%"></div></div>
        <p class="quiz-q">${r.m}</p>
        <div class="challenge-actions">
          <a class="prototype-btn dark" href="desafio.html?semana=${alvo}">Ir para um desafio ↗</a>
          <a class="prototype-btn secondary" href="aprenda.html">Ver dicas</a>
          <button class="prototype-btn secondary" id="again" type="button">Refazer</button>
        </div>`;
      box.classList.remove("swap"); void box.offsetWidth; box.classList.add("swap");
      document.getElementById("again").addEventListener("click", () => { i = 0; total = 0; pergunta(); });
    }
    pergunta();
  </script>
</body>
</html>
