<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato</title>
  <meta name="description" content="Fale com o projeto pelo telefone (83) 99405-2626.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="page-hero-inner" data-reveal>
        <p class="eyebrow">Contato</p>
        <h1>Vamos conversar?</h1>
        <p>Dúvidas, sugestões ou quer levar o projeto para a sua turma? Ligue ou chame no WhatsApp.</p>
      </div>
    </section>

    <section class="container contact-page">
      <div class="phone-card" data-reveal>
        <p class="eyebrow">Telefone / WhatsApp</p>
        <a class="phone-big" href="tel:+5583994052626" id="phoneNumber">(83) 99405-2626</a>
        <div class="phone-actions">
          <a class="prototype-btn dark" href="tel:+5583994052626">☎ Ligar agora</a>
          <a class="prototype-btn" href="https://wa.me/5583994052626" target="_blank" rel="noopener noreferrer">WhatsApp ↗</a>
          <button class="prototype-btn secondary" id="copyBtn" type="button">Copiar número</button>
        </div>
        <p class="challenge-small" id="copyMsg" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="desafios-data.js"></script>
  <script src="site.js"></script>
  <script>
    document.getElementById("copyBtn").addEventListener("click", async () => {
      const msg = document.getElementById("copyMsg");
      try { await navigator.clipboard.writeText("(83) 99405-2626"); msg.textContent = "Número copiado!"; }
      catch { msg.textContent = "Não foi possível copiar. Número: (83) 99405-2626"; }
    });
  </script>
</body>
</html>
