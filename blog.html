<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícias</title>
  <meta name="description" content="Últimas publicações do projeto Modo Aula.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .blog-hero{border-bottom:2px solid var(--line);padding:42px 0 34px}.blog-hero-inner{max-width:1000px;margin:0 auto;padding:0 28px;display:flex;justify-content:space-between;align-items:end;gap:30px}.blog-hero .blog-title{margin:0 0 14px;font-size:clamp(58px,9vw,96px);line-height:.85;font-weight:900;letter-spacing:-.06em}.blog-hero .blog-lead{max-width:520px;margin:0;font-size:clamp(20px,3vw,28px);line-height:1.1;font-weight:900;letter-spacing:-.03em}.blog-meta{padding-bottom:5px;text-align:right;font-size:11px}.blog-categories{border-bottom:2px solid var(--line);padding:14px 0;background:#d5d5d1}.category-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.category-label{margin-right:7px;font-size:10px;text-transform:uppercase}.category-pill{border:2px solid var(--line);background:#efefeb;padding:4px 8px;font:inherit;font-size:9px;cursor:pointer}.category-pill:hover,.category-pill.active{background:#aaa9a6}.blog-listing{padding:25px 0 55px;background:radial-gradient(rgba(0,0,0,.08) .75px,transparent .75px) 0 0/5px 5px,#dddcd7}.blog-list-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.blog-list-head h2{margin:0;font-size:28px;line-height:.95;font-weight:900;letter-spacing:-.045em}.blog-list-head span{font-size:10px}.news-card{height:100%}.news-card-top{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:27px;font-size:8px;text-transform:uppercase}.news-tag{border:1px solid var(--line);padding:2px 6px;background:#efefeb}.news-card-image-link{display:block;margin-top:5px}.news-thumb{position:relative;overflow:hidden;height:190px;border:2px solid var(--line);background:#efefeb}.news-thumb img{width:100%;height:100%;display:block;object-fit:cover;filter:grayscale(1)}.thumb-placeholder{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;filter:grayscale(1)}.thumb-placeholder{position:absolute;inset:0;background:radial-gradient(circle at 70% 28%,rgba(255,255,255,.75) 0 12%,transparent 13%),linear-gradient(135deg,#111 0 33%,#d4d4d0 33% 62%,#666 62% 100%)}.thumb-paper{background:linear-gradient(130deg,#111 0 28%,transparent 29%),radial-gradient(ellipse at 65% 58%,#222 0 12%,transparent 13%),#efefeb}.thumb-lines{background:repeating-linear-gradient(155deg,#111 0 13px,#eee 13px 24px)}.thumb-face{background:radial-gradient(ellipse at 50% 49%,#efefeb 0 18%,transparent 19%),radial-gradient(ellipse at 42% 45%,#111 0 5%,transparent 6%),radial-gradient(ellipse at 58% 45%,#111 0 5%,transparent 6%),linear-gradient(115deg,#111 0 35%,#aaa 35% 65%,#222 65%)}.thumb-eye{background:radial-gradient(ellipse at center,#111 0 8%,#efefeb 9% 16%,#111 17% 28%,transparent 29%),linear-gradient(135deg,#aaa,#111)}.thumb-window{background:linear-gradient(90deg,#111 0 16%,#bbb 16% 27%,#111 27% 42%,#ddd 42% 57%,#111 57% 73%,#bbb 73% 84%,#111 84%)}.news-card-body{padding-top:10px}.news-card-body h3{margin:0;font-size:18px;line-height:.98;font-weight:900;letter-spacing:-.04em}.news-card-body h3 a:hover{text-decoration:underline}.news-card-body p{margin:7px 0 10px;font-size:11px;line-height:1.3}.news-card-footer{display:flex;justify-content:space-between;gap:10px;padding-top:6px;border-top:1px solid #777;font-size:8px;text-transform:uppercase}.empty-state,.data-message{padding:25px;border:2px solid var(--line);background:#efefeb;font-size:12px}.data-message{margin-top:15px}.article-detail{padding:28px 0 60px;background:radial-gradient(rgba(0,0,0,.08) .75px,transparent .75px) 0 0/5px 5px,#dddcd7}.article-shell{max-width:820px;margin:0 auto;padding:0 28px}.article-back-row{margin-bottom:20px}.article-header{border-top:2px solid var(--line);padding-top:18px}.article-header h1{margin:16px 0 10px;font-size:clamp(44px,7vw,78px);line-height:.82;letter-spacing:-.07em;font-weight:900}.article-lead{max-width:680px;margin:0 0 12px;font-size:16px;line-height:1.3}.article-hero{margin:22px 0}.article-hero .news-thumb{height:340px}.article-text{max-width:680px}.article-text p{margin:0 0 17px;font-size:16px;line-height:1.55}[hidden]{display:none!important}
    /* Correção do grid de notícias: uma única grade Bootstrap, sem row aninhada */
    #blogNewsGrid{align-items:stretch;}
    #blogNewsGrid > .news-card{margin-bottom:0;}
    .news-card{display:flex;flex-direction:column;}
    .news-card-body{display:flex;flex:1;flex-direction:column;}
    .news-card-body p{flex:0 0 auto;}
    .news-card-footer{margin-top:auto;}
    .news-source{margin-top:10px;}
@media(max-width:767.98px){.blog-hero-inner{align-items:start;flex-direction:column}.blog-meta{text-align:left}.news-thumb{height:210px}.article-hero .news-thumb{height:250px}}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="blog-hero">
      <div class="blog-hero-inner">
        <div><h1 class="blog-title">Notícias</h1><p class="blog-lead">Notícias, ideias e experiências sobre atenção, hábitos digitais e uso consciente do celular na escola.</p></div>
        <div class="blog-meta"><strong>PUBLICAÇÕES</strong><br><span>As mais recentes aparecem primeiro.</span></div>
      </div>
    </section>

    <section class="blog-categories">
      <div class="container"><div class="category-row">
        <span class="category-label">Categorias</span>
        <button class="category-pill active" type="button" data-category="Notícias">Notícias</button>
      </div></div>
    </section>

    <section class="blog-listing" id="blogListing">
      <div class="container">
        <div class="blog-list-head"><h2>Últimas publicações</h2><span id="newsCount">Carregando...</span></div>
        <div class="row g-4" id="blogNewsGrid"><div class="empty-state">Carregando publicações...</div></div>
        <p class="data-message" data-news-error hidden></p>
      </div>
    </section>

    <section class="article-detail" id="articleDetail" hidden><div class="article-shell" id="articleContent"></div></section>
  </main>

  <div id="site-footer"></div>
  <script src="desafios-data.js"></script>
  <script src="site.js"></script>
  <script src="blog.js"></script>
</body>
</html>
