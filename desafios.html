<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafios</title>
  <meta name="description" content="Os 12 desafios semanais do projeto.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="page-hero-inner" data-reveal>
        <p class="eyebrow">Desafios</p>
        <h1>12 semanas.<br>12 desafios.</h1>
        <p>Um desafio por semana para treinar o foco. Escolha um, veja como fazer e marque quando concluir.</p>
        <div class="progress-block">
          <div class="challenge-progress-line"><div class="challenge-progress-fill" id="doneFill"></div></div>
          <div class="challenge-small" id="doneLabel">0 de 12 concluídos</div>
        </div>
      </div>
    </section>

    <section class="projects-section">
      <div class="container">
        <div class="section-heading">
          <h2>Todos os desafios</h2>
          <div class="filter-row" id="filterRow">
            <button class="category-pill active" data-filter="all" type="button">Todos</button>
            <button class="category-pill" data-filter="pending" type="button">A fazer</button>
            <button class="category-pill" data-filter="done" type="button">Concluídos</button>
          </div>
        </div>
        <div class="challenge-grid" id="challengeGrid" data-stagger></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="desafios-data.js"></script>
  <script src="site.js"></script>
  <script>
    const grid = document.getElementById("challengeGrid");
    const atual = calcularSemanaAtual();
    let filtro = "all";

    function render() {
      const feitos = getConcluidos();
      document.getElementById("doneFill").style.width = `${(feitos.length / desafios.length) * 100}%`;
      document.getElementById("doneLabel").textContent = `${feitos.length} de ${desafios.length} concluídos`;
      grid.innerHTML = desafios
        .filter(d => filtro === "all" || (filtro === "done") === feitos.includes(d.semana))
        .map(d => {
          const feito = feitos.includes(d.semana);
          const status = feito ? "Concluído ✓" : d.semana === atual ? "Semana atual" : "Disponível";
          return `<a class="challenge-card ${feito ? "done" : ""} ${d.semana === atual ? "current" : ""}" href="desafio.html?semana=${d.semana}">
            <div class="cc-top"><span class="cc-num">${String(d.semana).padStart(2, "0")}</span><span class="cc-status">${status}</span></div>
            <h3>${d.titulo}</h3>
            <p>${d.descricao}</p>
            <div class="cc-foot"><span>${formatarPeriodo(d.semana)}</span><span class="arrow">↗</span></div>
          </a>`;
        }).join("") || `<div class="empty-state">Nenhum desafio aqui ainda.</div>`;
      grid.querySelectorAll(".challenge-card").forEach((c, i) => { c.setAttribute("data-reveal", ""); c.style.transitionDelay = `${Math.min(i, 8) * 50}ms`; });
      window.revealObserve && window.revealObserve();
    }
    document.getElementById("filterRow").addEventListener("click", e => {
      const b = e.target.closest("[data-filter]"); if (!b) return;
      filtro = b.dataset.filter;
      document.querySelectorAll("#filterRow .category-pill").forEach(p => p.classList.toggle("active", p === b));
      render();
    });
    render();
  </script>
</body>
</html>
